# Migration of AppVeyor builds (appveyor.yml) to GitHub Actions.
# Windows MSI/library/benchmark, Emscripten, optional macOS via existing scripts.
#
# Original:
#   Visual Studio 2019 -> build/appveyor/build.cmd
#   Ubuntu2204         -> build/appveyor/build.sh  (emscripten + docker macos)

name: AppVeyor-compat builds

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VS / CMake)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install WiX Toolset
        run: choco install -y wixtoolset

      - name: Add WiX to PATH
        shell: bash
        run: |
          echo "C:/Program Files (x86)/WiX Toolset v3.11/bin" >> "$GITHUB_PATH"
          echo "C:/Program Files/WiX Toolset v3.11/bin" >> "$GITHUB_PATH"

      - name: Build (build.cmd)
        shell: cmd
        run: build\appveyor\build.cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows
          if-no-files-found: warn
          path: |
            build/cmake/build_win32_library/Release/unreal_speccy_portable.*
            build/cmake/build_win32_benchmark/Release/unreal_speccy_portable.exe
            build/cmake/build_win32_sdl2/*.msi
            build/cmake/build_win32_wxwidgets/*.msi

  emscripten:
    name: Emscripten (SDL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build Emscripten target
        run: |
          source emsdk/emsdk_env.sh
          mkdir -p build/cmake/build_emscripten
          cd build/cmake/build_emscripten
          emcmake cmake .. \
            -DUSE_SDL=0 \
            -DUSE_SDL2=1 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel "$(nproc)"
          zip -9 unreal-speccy-portable_emscripten_sdl2_gles2.zip unreal_speccy_portable.*

      - name: Upload Emscripten artifacts
        uses: actions/upload-artifact@v6
        with:
          name: emscripten
          if-no-files-found: warn
          path: build/cmake/build_emscripten/*.zip

  # Optional: same path as AppVeyor Ubuntu job (docker -> .dmg).
  macos-docker:
    name: macOS via Docker (AppVeyor script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build macOS dmg (docker script)
        run: |
          chmod +x build/docker/build_macos.sh || true
          cd build/docker
          ./build_macos.sh

      - name: Upload dmg
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg-docker
          if-no-files-found: warn
          path: build/docker/*.dmg
