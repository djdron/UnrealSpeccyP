# macOS builds via Docker/osxcross (x86_64 + arm64 from build_macos.sh)
name: macOS

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  macos-docker:
    name: macOS SDL2 GLESv2 (ANGLE) curl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build macOS dmg (docker script)
        run: |
          chmod +x build/docker/build_macos.sh || true
          cd build/docker
          ./build_macos.sh

      - name: Upload x86_64 dmg
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          path: build/docker/*x86_64*.dmg
          archive: false

      - name: Upload arm64 dmg
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: warn
          path: build/docker/*arm64*.dmg
          archive: false
