# Windows builds (from AppVeyor build.cmd)
name: Windows

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (VS / CMake)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install WiX Toolset
        run: choco install -y wixtoolset

      - name: Add WiX to PATH
        shell: bash
        run: |
          echo "C:/Program Files (x86)/WiX Toolset v3.11/bin" >> "$GITHUB_PATH"
          echo "C:/Program Files/WiX Toolset v3.11/bin" >> "$GITHUB_PATH"

      - name: Build (build.cmd)
        shell: cmd
        run: build\appveyor\build.cmd

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows
          if-no-files-found: warn
          path: |
            build/cmake/build_win32_library/Release/unreal_speccy_portable.*
            build/cmake/build_win32_benchmark/Release/unreal_speccy_portable.exe
            build/cmake/build_win32_sdl2/*.msi
            build/cmake/build_win32_wxwidgets/*.msi
